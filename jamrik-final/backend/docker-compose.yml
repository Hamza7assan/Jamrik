services:
  db:
    image: postgres:15
    container_name: jamrik_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  jamrik_ai:
    build:
      context: ../../jamrik-ai-service
      dockerfile: Dockerfile
    container_name: jamrik_ai
    env_file:
      - .env
    environment:
      - VECTOR_DB_PATH=/app/jamrik_vectordb
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"

  app:
    build: .
    container_name: jamrik_app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - jamrik_ai
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_AI_GOOGLE_AI_API_KEY=${SPRING_AI_GOOGLE_AI_API_KEY}
      - JAMRIK_AI_SERVICE_BASE_URL=http://jamrik_ai:8000

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jamrik_frontend
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  postgres_data: